<style>
/* ============================================================
   SEATING.CSS  —  Seating chart grid, stage, seat indicators
   ============================================================ */

/* ── Seating Layout ───────────────────────────────────────── */
.seating-page { display: flex; flex-direction: column; gap: 20px; }

.seating-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 18px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.seating-toolbar .toolbar-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ── Stage Banner ─────────────────────────────────────────── */
.stage-banner {
  background: linear-gradient(135deg, rgba(59,111,232,0.15), rgba(108,71,255,0.15));
  border: 1px solid rgba(108,71,255,0.3);
  border-radius: var(--radius-lg);
  padding: 14px 24px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent-violet);
}

/* ── Sections Container ───────────────────────────────────── */
.sections-container {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 8px;
  align-items: flex-start;
}
.sections-container::-webkit-scrollbar { height: 4px; }
.sections-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── Section Block ────────────────────────────────────────── */
.section-block {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  flex-shrink: 0;
  min-width: 200px;
}
.section-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-count {
  font-size: 11px;
  background: var(--bg-elevated);
  padding: 2px 8px;
  border-radius: 20px;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-weight: 500;
}

/* ── Seat Rows ────────────────────────────────────────────── */
.seat-rows { display: flex; flex-direction: column; gap: 5px; }
.seat-row {
  display: flex;
  align-items: center;
  gap: 4px;
}
.row-label {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  width: 26px;
  text-align: right;
  flex-shrink: 0;
}
.seats-in-row { display: flex; flex-wrap: wrap; gap: 3px; }

/* ── Individual Seat ──────────────────────────────────────── */
.seat {
  width: 18px;
  height: 18px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  cursor: pointer;
  transition: all 100ms;
  position: relative;
}
.seat:hover { transform: scale(1.25); z-index: 10; border-color: var(--accent-blue); }
.seat.empty    { background: var(--bg-elevated); }
.seat.occupied { background: rgba(76,130,255,0.35); border-color: rgba(76,130,255,0.5); }
.seat.honor    { background: rgba(240,192,64,0.4);  border-color: rgba(240,192,64,0.6); }
.seat.cte      { background: rgba(74,144,217,0.4);  border-color: rgba(74,144,217,0.6); }
.seat.avid     { background: rgba(155,127,255,0.4); border-color: rgba(155,127,255,0.6); }
.seat.asb      { background: rgba(62,207,142,0.4);  border-color: rgba(62,207,142,0.6); }
.seat.military { background: rgba(200,150,90,0.4);  border-color: rgba(200,150,90,0.6); }
.seat.special  { background: rgba(232,115,90,0.4);  border-color: rgba(232,115,90,0.6); }

/* ── Seat Tooltip ─────────────────────────────────────────── */
.seat-tooltip {
  position: fixed;
  background: var(--bg-elevated);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  font-size: 12.5px;
  color: var(--text-primary);
  z-index: 500;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  animation: popIn 100ms var(--ease);
}
.seat-tooltip .tip-name  { font-weight: 600; margin-bottom: 3px; }
.seat-tooltip .tip-id    { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.seat-tooltip .tip-cats  { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 3px; }

/* ── Seating Legend ───────────────────────────────────────── */
.seat-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 14px 18px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}
.legend-dot {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  flex-shrink: 0;
}

/* ── Config Panel ─────────────────────────────────────────── */
.config-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.config-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elevated);
}
.config-panel-body { padding: 18px; }

.section-config-row {
  display: grid;
  grid-template-columns: 1fr 80px 100px 36px;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.section-config-row:last-of-type { border-bottom: none; }
.section-config-row label { font-size: 13px; color: var(--text-secondary); }
.section-config-row input {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 6px 8px;
  text-align: center;
  outline: none;
}
.section-config-row input:focus { border-color: var(--accent-blue); }
.section-config-row .delete-section-btn {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 15px;
  transition: all var(--dur-fast);
}
.section-config-row .delete-section-btn:hover { background: rgba(255,85,102,0.15); color: var(--accent-red); }

/* ── Seating Summary Stats ────────────────────────────────── */
.seating-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 10px;
}
.seating-stat-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  text-align: center;
}
.seating-stat-card .s-value { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.seating-stat-card .s-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }


/* Custom Seating Chart Role Colors - Semi-Transparent Style */
  
  .seat.jh { 
      background-color: color-mix(in srgb, var(--accent-red) 20%, transparent) !important; 
      border-color: var(--accent-red) !important; 
  }
  .seat.jh span { color: #ffffff !important; }

  .seat.aide { 
      background-color: rgba(156, 39, 176, 0.2) !important; 
      border-color: #9c27b0 !important; 
  }
  .seat.aide span { color: #ffffff !important; }

  .seat.val-sal { 
      background-color: rgba(255, 215, 0, 0.2) !important; 
      border-color: #ffd700 !important; 
  }
  .seat.val-sal span { color: #ffffff !important; }

  .seat.honor-orange { 
      background-color: rgba(255, 152, 0, 0.2) !important; 
      border-color: #ff9800 !important; 
  }
  .seat.honor-orange span { color: #ffffff !important; }

  .seat.staff-blue { 
      background-color: color-mix(in srgb, var(--accent-blue, #206bc4) 20%, transparent) !important; 
      border-color: var(--accent-blue, #206bc4) !important; 
  }
  .seat.staff-blue span { color: #ffffff !important; }

  .seat.regular { 
      background-color: rgba(255, 255, 255, 0.1) !important; 
      border-color: #cccccc !important; 
  }
  .seat.regular span { color: #ffffff !important; }
</style>
