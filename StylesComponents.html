<style>
/* ============================================================
   COMPONENTS.CSS  —  Modal, Toast, Tabs, Empty States, etc.
   ============================================================ */

/* ── Modal ────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn var(--dur-fast) var(--ease);
}
.modal-overlay.hidden { display: none; }

.modal-box {
  background: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-modal);
  animation: slideUp var(--dur-med) var(--ease);
}
.modal-box.modal-lg { max-width: 720px; }
.modal-box.modal-xl { max-width: 900px; }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.2px;
}
.modal-close {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 16px;
  transition: all var(--dur-fast);
}
.modal-close:hover { background: var(--bg-elevated); color: var(--text-primary); }

.modal-body {
  padding: 20px 24px 24px;
  overflow-y: auto;
  flex: 1;
}
.modal-body::-webkit-scrollbar { width: 4px; }
.modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

/* ── Toast Notifications ──────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  border: 1px solid var(--border-light);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-primary);
  pointer-events: all;
  min-width: 260px;
  max-width: 360px;
  animation: slideInRight var(--dur-med) var(--ease);
}
.toast.toast-success { border-color: rgba(62,207,142,0.4); }
.toast.toast-success .toast-icon { color: var(--accent-green); }
.toast.toast-error   { border-color: rgba(255,85,102,0.4); }
.toast.toast-error   .toast-icon { color: var(--accent-red); }
.toast.toast-info    { border-color: rgba(76,130,255,0.4); }
.toast.toast-info    .toast-icon { color: var(--accent-blue); }
.toast.toast-warning { border-color: rgba(244,164,48,0.4); }
.toast.toast-warning .toast-icon { color: var(--accent-amber); }
.toast-icon { font-size: 17px; flex-shrink: 0; }
.toast-msg  { flex: 1; }
.toast.dismissing { animation: slideOutRight var(--dur-med) var(--ease) forwards; }

/* ── Tabs ─────────────────────────────────────────────────── */
.tab-bar {
  display: flex;
  gap: 2px;
  background: var(--bg-elevated);
  border-radius: var(--radius-lg);
  padding: 4px;
  border: 1px solid var(--border);
  width: fit-content;
  margin-bottom: 20px;
  /* Added these to enable horizontal scrolling */
  max-width: 100%;
  overflow-x: auto;
}
/* Optional: Make the scrollbar look nice */
.tab-bar::-webkit-scrollbar { height: 4px; }
.tab-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.tab-btn {
  padding: 7px 16px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: all var(--dur-fast) var(--ease);
  white-space: nowrap;
  flex-shrink: 0; /* Added this so the buttons don't get squished */
}
.tab-btn:hover { color: var(--text-primary); background: var(--border); }
.tab-btn.active {
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Empty State ──────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  text-align: center;
  color: var(--text-muted);
}
.empty-state .empty-icon {
  font-size: 48px;
  margin-bottom: 14px;
  opacity: 0.4;
}
.empty-state h3 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.empty-state p {
  font-size: 13.5px;
  max-width: 280px;
  line-height: 1.6;
  margin-bottom: 20px;
}

/* ── Info Banner ──────────────────────────────────────────── */
.info-banner {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  padding: 12px;
  border-radius: var(--radius-md);
  margin-bottom: 16px;
  color: var(--text-secondary);
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.info-banner.warning {
  border-color: var(--accent-red);
  color: var(--accent-red);
}
.info-banner.info    { background: rgba(76,130,255,0.1);  border: 1px solid rgba(76,130,255,0.25); color: #8ABAFF; }
.info-banner.success { background: rgba(62,207,142,0.1);  border: 1px solid rgba(62,207,142,0.25); color: #5DDBA8; }
.info-banner.danger  { background: rgba(255,85,102,0.1);  border: 1px solid rgba(255,85,102,0.25); color: #FF8899; }
.info-banner .ti { font-size: 16px; margin-top: 1px; flex-shrink: 0; }

/* ── Progress Bar ─────────────────────────────────────────── */
.progress-bar-wrap {
  background: var(--bg-elevated);
  border-radius: 20px;
  height: 6px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 20px;
  background: var(--brand-grad);
  transition: width 0.6s var(--ease);
}

/* ── Confirm Dialog ───────────────────────────────────────── */
.confirm-body { text-align: center; padding: 8px 0 4px; }
.confirm-body .confirm-icon { font-size: 40px; color: var(--accent-red); margin-bottom: 12px; }
.confirm-body p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.confirm-body strong { color: var(--text-primary); }

/* ── Role Badge ───────────────────────────────────────────── */
.role-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.role-badge.admin    { background: rgba(108,71,255,0.15); color: var(--accent-violet); border: 1px solid rgba(108,71,255,0.3); }
.role-badge.manager  { background: rgba(76,130,255,0.15); color: var(--accent-blue);   border: 1px solid rgba(76,130,255,0.3); }
.role-badge.viewer   { background: var(--bg-elevated);    color: var(--text-muted);    border: 1px solid var(--border); }

/* ── Animations ───────────────────────────────────────────── */
@keyframes fadeIn      { from { opacity: 0; }                        to { opacity: 1; } }
@keyframes slideUp     { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes slideInRight  { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
@keyframes slideOutRight { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(20px); } }
@keyframes popIn       { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

/* ── Responsive tweaks ────────────────────────────────────── */
@media (max-width: 768px) {
  .form-grid, .form-grid-3 { grid-template-columns: 1fr; }
  #view-container { padding: 16px; }
  .page-header { flex-direction: column; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
