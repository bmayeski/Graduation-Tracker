<script>
/* ============================================================
   USERS.JS  —  Admin panel for managing staff access
   ============================================================ */

const UsersAdmin = (() => {

  async function render(container) {
    container.innerHTML = `
      <div class="page-header">
        <div class="page-title-block">
          <h1>User Management</h1>
          <p>Manage staff access and editing permissions</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" onclick="UsersAdmin.openAddModal()">
            <span class="ti ti-plus"></span> Add Staff Member
          </button>
        </div>
      </div>
      <div class="card" id="users-card" style="padding:0; overflow:hidden">
         <div class="loading-screen" style="height:200px"><div class="spinner"></div></div>
      </div>
    `;

    try {
      const res = await App.Server.getAllUsers();
      if(!res.success) throw new Error(res.error);
      
      const users = res.users;
      let rows = users.map(u => `
        <tr>
          <td>
             <div class="flex items-center gap-12">
               <div class="user-avatar" style="width:28px;height:28px;font-size:11px">${u.email.charAt(0).toUpperCase()}</div>
               <div>
                  <div style="font-weight:600">${u.displayName || '—'}</div>
                  <div class="text-muted" style="font-size:12px">${u.email}</div>
               </div>
             </div>
          </td>
          <td><span class="role-badge ${u.role === 'admin' ? 'admin' : (u.role === 'category_manager' ? 'manager' : 'viewer')}">${u.role}</span></td>
          <td>${u.categories && u.categories.length ? u.categories.map(c => `<span class="badge" style="background:var(--bg-elevated);border:1px solid var(--border)">${c}</span>`).join(' ') : '<span class="text-muted">—</span>'}</td>
          <td style="text-align:right">
            ${u.email !== App.getUser().email ? `<button class="btn btn-ghost btn-sm btn-icon" onclick="UsersAdmin.removeUser('${u.email}')"><span class="ti ti-trash text-muted"></span></button>` : ''}
          </td>
        </tr>
      `).join('');

      document.getElementById('users-card').innerHTML = `
        <div class="table-wrap" style="border:none; border-radius:0;">
          <table class="data-table">
            <thead><tr><th>Staff Member</th><th>Role</th><th>Assigned Categories</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4" class="text-center text-muted" style="padding:24px">No users found.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    } catch(err) {
      document.getElementById('users-card').innerHTML = `<div class="empty-state"><span class="ti ti-alert-triangle empty-icon"></span><h3>Error loading users</h3><p>${err.message}</p></div>`;
    }
  }

  function openAddModal() {
    const cats = App.getCategories();
    let catHtml = cats.map(c => `
      <label class="toggle-chip" style="--chip-color: ${c.color}">
         <input type="checkbox" id="user_cat_${c.id}" value="${c.id}" onchange="this.parentElement.classList.toggle('checked', this.checked)">
         <span class="ti ti-${c.icon}"></span> ${c.label}
      </label>
    `).join('');

    UI.openModal('Add Staff Access', `
      <form id="user-form" onsubmit="event.preventDefault(); UsersAdmin.saveUser()">
        <div class="form-group mb-16">
          <label class="form-label">Google Workspace Email</label>
          <input type="email" id="u_email" class="form-input" required placeholder="teacher@school.edu">
        </div>
        <div class="form-group mb-16">
          <label class="form-label">Display Name</label>
          <input type="text" id="u_name" class="form-input" placeholder="Mr. Smith">
        </div>
        <div class="form-group mb-16">
          <label class="form-label">Role</label>
          <select id="u_role" class="form-select" onchange="document.getElementById('u_cats_wrap').classList.toggle('hidden', this.value !== 'category_manager')">
             <option value="viewer">Viewer (Read-only)</option>
             <option value="category_manager">Category Manager</option>
             <option value="admin">Administrator (Full Access)</option>
          </select>
        </div>
        <div class="form-group mb-24 hidden" id="u_cats_wrap">
           <label class="form-label">Which lists can they edit?</label>
           <div class="toggle-group">${catHtml}</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="UI.closeModalDirect()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-user-btn">Add User</button>
        </div>
      </form>
    `);
  }

  async function saveUser() {
    const email = document.getElementById('u_email').value.trim();
    const name = document.getElementById('u_name').value.trim();
    const role = document.getElementById('u_role').value;
    
    let categories = [];
    if(role === 'category_manager') {
       App.getCategories().forEach(c => {
         if(document.getElementById(`user_cat_${c.id}`).checked) categories.push(c.id);
       });
    } else if(role === 'admin') {
       categories = App.getCategories().map(c => c.id);
    }

    const btn = document.getElementById('save-user-btn');
    btn.disabled = true; btn.innerText = 'Saving...';

    try {
       const res = await App.Server.addUser(email, role, categories, name);
       if(res.success) {
         UI.closeModalDirect();
         UI.toast('Staff member added', 'success');
         UI.navigate('users'); 
       } else {
         throw new Error(res.error);
       }
    } catch(err) {
       UI.toast(err.message, 'error');
       btn.disabled = false; btn.innerText = 'Add User';
    }
  }

  function removeUser(email) {
     UI.confirm(`Remove access for ${email}?`, async () => {
        try {
          const res = await App.Server.removeUser(email);
          if(res.success) {
             UI.toast('User removed', 'success');
             UI.navigate('users'); 
          } else {
             throw new Error(res.error);
          }
        } catch(err) {
          UI.toast(err.message, 'error');
        }
     });
  }

  return { render, openAddModal, saveUser, removeUser };
})();
</script>
