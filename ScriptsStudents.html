<script>
(function() {
  const Students = (() => {

    // 1. ADD THIS TO YOUR STUDENTS MODULE
    function handleSearch() {
      const query = document.getElementById('student-search').value.toLowerCase();
      const students = App.getStudents();
      const categories = App.getCategories();

      // Filter students based on Name, ID, or Category Badge Labels
      const filtered = students.filter(s => {
        const nameMatch = (s.firstName + ' ' + s.lastName).toLowerCase().includes(query);
        const idMatch = String(s.studentId).toLowerCase().includes(query);
        const categoryMatch = categories.some(cat => 
          (s[cat.id] === true || s[cat.label] === true) && 
          cat.label.toLowerCase().includes(query)
        );
        return nameMatch || idMatch || categoryMatch;
      });

      // Re-render just the table body
      const tbody = document.querySelector('#all-students-table tbody');
      if (tbody) {
        tbody.innerHTML = _generateTableRows(filtered, categories);
      }
    }

    // Helper to keep table generation DRY (Don't Repeat Yourself)
    function _generateTableRows(students, categories) {
      return students.map(s => {
        // Logic to check if student is not participating
        const isNotParticipating = (s['notwalking'] || s['nongrad']);
        
        // Use a class instead of inline style for better CSS control
        const rowClass = isNotParticipating ? 'class="row-not-participating"' : '';

        const cordBadges = categories
          .filter(cat => cat.group === 'Cord' && (s[cat.id] === true || s[cat.label] === true))
          .map(cat => `<span class="badge" style="background-color: ${cat.color || '#3B6FE8'}20; color: ${cat.color || '#3B6FE8'}; border: 1px solid ${cat.color || '#3B6FE8'}50; margin-right: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px;">${cat.label}</span>`)
          .join(' ');

        const adminBadges = categories
          .filter(cat => cat.group === 'Admin' && (s[cat.id] === true || s[cat.label] === true))
          .map(cat => `<span class="badge" style="background-color: ${cat.color || '#6C47FF'}20; color: ${cat.color || '#6C47FF'}; border: 1px solid ${cat.color || '#6C47FF'}50; margin-right: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px;">${cat.label}</span>`)
          .join(' ');

        return `
          <tr ${rowClass}>
            <td><strong>${s.lastName || ''}, ${s.firstName || ''}</strong></td>
            <td>${s.studentId || ''}</td>
            <td>${isNotParticipating ? '<span class="badge warning">Not Participating</span>' : '<span class="badge success">Walking</span>'}</td>
            <td>${cordBadges}</td>
            <td>${adminBadges}</td>
          </tr>
        `;
      }).join('');
    }

    // 2. UPDATED RENDER FUNCTION
    function renderStudentList(container, viewType = 'all') {
      const allStudents = App.getStudents();
      const categories = App.getCategories();

      // 1. Calculate stats dynamically
      const notParticipating = allStudents.filter(s => (s['notwalking'] || s['nongrad']));
      const walking = allStudents.filter(s => !(s['notwalking'] || s['nongrad']));
      
      // 2. Filter data based on view
      let displayStudents = allStudents;
      let title = "All Students";
      
      if (viewType === 'walking') {
        displayStudents = walking;
        title = "Walking Students";
      } else if (viewType === 'not_participating') {
        displayStudents = notParticipating;
        title = "Not Participating Students";
      }

      // 3. Render
      container.innerHTML = `
        <div class="page-header">
          <div class="page-title-block">
            <h1>${title}</h1>
            <p>
              <strong>Walking:</strong> ${walking.length} | 
              <strong>Not Participating:</strong> ${notParticipating.length}
            </p>
          </div>
          <div class="header-actions">
            <input type="text" id="student-search" class="form-input" placeholder="Search..." oninput="Students.handleSearch()" style="width: 200px;">
          </div>
        </div>
        <div class="card">
          <table class="data-table" id="all-students-table">
            <thead>
              <tr>
                <th>Student</th>
                <th>ID</th>
                <th>Status</th>
                <th>Cords</th>
                <th>Administrative</th>
              </tr>
            </thead>
            <tbody>${_generateTableRows(displayStudents, categories)}</tbody>
          </table>
        </div>
      `;
    }

    // --- MODAL & DATA FUNCTIONS ---
    function openAddModal(preselectedCat = null) { 
      UI.openModal('Add New Student', _getFormHtml({}, preselectedCat), {size: 'lg'});
    } 

    function openEditModal(studentId) { 
      const student = App.getStudents().find(s => s.studentId == studentId); 
      if(!student) return UI.toast('Student not found', 'error');
      UI.openModal('Edit Student', _getFormHtml(student), {size: 'lg'});
    }

    async function saveStudent(existingId) {
      const btn = document.getElementById('save-student-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = ' Saving...'; }

      const payload = { 
        studentId: existingId || document.getElementById('field_studentId').value.trim(), 
        firstName: document.getElementById('field_firstName').value.trim(), 
        lastName: document.getElementById('field_lastName').value.trim(), 
        nonGrad: document.getElementById('field_nonGrad') ? document.getElementById('field_nonGrad').checked : false, 
        notWalking: document.getElementById('field_notWalking') ? document.getElementById('field_notWalking').checked : false
      };

      App.getCategories().forEach(c => { 
        const el = document.getElementById(`field_${c.id}`); 
        if(el && !el.disabled) payload[c.id] = el.checked; 
      });

      try { 
        const res = existingId ? 
          await App.Server.updateStudent(existingId, payload) : 
          await App.Server.addStudent(payload); 
          
        if(res.success) { 
          App.upsertStudent({...payload, studentId: res.studentId || payload.studentId});
          UI.closeModal();
          UI.toast('Student saved successfully', 'success'); 
          UI.navigate(App.getState().currentView); 
        } else { 
          throw new Error(res.error || 'Failed to save');
        } 
      } catch(err) { 
        UI.toast(err.message, 'error'); 
        if (btn) { btn.disabled = false; btn.innerText = 'Save Student'; }
      } 
    }

    function deleteStudent(studentId) {
      UI.confirm('Are you sure you want to delete this student?', async () => {
        try {
          const res = await App.Server.deleteStudent(studentId);
          if(res.success) {
            App.removeStudent(studentId);
            UI.closeModal();
            UI.navigate(App.getState().currentView);
            UI.toast('Student deleted', 'success');
          }
        } catch(err) { UI.toast(err.message, 'error'); }
      });
    }

    function showFiltered(type) {
      console.log("Filtering by:", type);
      UI.navigate('students');
    }

    // --- BULK IMPORT LOGIC ---
    function openBulkAddModal(catId) {
        const category = App.getCategories().find(c => c.id === catId) || { id: catId, label: catId };
        
        // We use a clean string literal for the HTML
        const html = `
          <div style="padding: 10px;">
            <p style="margin-bottom: 15px;">
              Paste student IDs below for <strong>${category.label}</strong>.
            </p>
            <textarea id="bulk-ids-input" style="width: 100%; height: 150px; padding: 10px; border-radius: 4px;"></textarea>
            
            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
              <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
              <button id="bulk-submit-btn" class="btn btn-primary" onclick="Students.processBulkAdd('${catId}')">Import IDs</button>
            </div>
          </div>
        `;
        UI.openModal(`Bulk Import: ${category.label}`, html);
    }

    async function processBulkAdd(categoryId) {
        const btn = document.getElementById('bulk-submit-btn');
        btn.disabled = true;
        btn.innerHTML = ' Importing...';
        
        const input = document.getElementById('bulk-ids-input').value;
        const ids = input.split(/[,\s\n]+/).filter(id => id.trim() !== '');

        if (ids.length === 0) {
            UI.toast('Please enter at least one Student ID.', 'error');
            btn.disabled = false;
            btn.innerHTML = 'Import IDs';
            return;
        }

        try {
            const res = await App.Server.bulkAssignCategory(ids, categoryId);
            if (res.success) {
                UI.toast(`Successfully assigned ${res.updated} students.`, 'success');
                UI.closeModal();
                await App.refreshData();
                UI.navigate(App.getState().currentView);
            } else {
                throw new Error(res.error || 'Failed to bulk import');
            }
        } catch(err) {
            UI.toast(err.message, 'error');
            btn.disabled = false;
            btn.innerHTML = 'Import IDs';
        }
    }

    // --- FORM BUILDER (Replace with your actual implementation) ---
    function _getFormHtml(student = {}, preselectedCat = null) {
        return `<div>Form builder placeholder - ensure your original code is pasted here!</div>`;
    }

    return { 
      renderStudentList, 
      openAddModal, 
      openEditModal, 
      saveStudent, 
      deleteStudent, 
      showFiltered, 
      openBulkAddModal, 
      processBulkAdd,
      handleSearch // Add this!
    };
  })();

  window.Students = Students;
})();
</script>
