<script>
/* ============================================================
   SEATING.JS  —  Visual seating chart renderer
   ============================================================ */

const Seating = (() => {
  let currentConfig = null;
  let currentSeatMap = null;

  async function render(container) {
     container.innerHTML = `
      <div class="page-header">
        <div class="page-title-block">
          <h1>Seating Chart</h1>
          <p>Visual map of ceremony seating</p>
        </div>
        <div class="page-actions">
           <button class="btn btn-ghost" onclick="Seating.openConfigModal()">
             <span class="ti ti-settings"></span> Layout Config
           </button>
           
           <button class="btn btn-secondary" id="btn-assign-jh" onclick="Seating.assignJHToRowK()" title="Assigns Junior Honors outside-in for Row K">
             <span class="ti ti-users"></span> Assign JH to Row K
           </button>
           
           <button class="btn btn-secondary" onclick="Seating.generate(false)" title="Keeps manually assigned seats">
             <span class="ti ti-wand"></span> Auto-Assign Missing
           </button>
           <button class="btn btn-danger" onclick="Seating.generate(true)" title="Clears all seats and starts over">
             <span class="ti ti-refresh"></span> Overwrite All
           </button>
        </div>
      </div>
      <div id="seating-canvas"><div class="loading-screen" style="height:200px"><div class="spinner"></div></div></div>
     `;

     try {
       const res = await App.Server.getSeatingChart();
       currentConfig = res.config;
       currentSeatMap = res.seatMap;
       _renderChart(res.config, res.seatMap);
     } catch(err) {
       document.getElementById('seating-canvas').innerHTML = `<div class="empty-state"><span class="ti ti-alert-triangle empty-icon"></span><h3>Error loading</h3><p>${err.message}</p></div>`;
     }
  }

  function _renderChart(config, seatMap) {
     const canvas = document.getElementById('seating-canvas');
     
     // Pre-calculate row offsets based on cumulative seats
     let rowOffsets = [];
     let currentOffset = 0;
     const maxRows = Math.max(config.sections[0].rows.length, config.sections[1].rows.length);
     for(let r=0; r<maxRows; r++) {
        rowOffsets.push(currentOffset);
        currentOffset += (config.sections[0].rows[r] || 0) + (config.sections[1].rows[r] || 0);
     }
     
     let sectionsHtml = config.sections.map((sec, secIndex) => {
        let rowsHtml = '';
        let totalSeats = 0;
        
        sec.rows.forEach((seatCount, rowIndex) => {
           let r = rowIndex + 1;
           
           // Use alphabet letters for rows (65 is 'A' in ASCII)
           let letter = String.fromCharCode(65 + rowIndex);
           let displayRow = `${letter} - ${sec.id}`;
           
           let offset = rowOffsets[rowIndex];
           totalSeats += seatCount;
           let seatsHtml = '';
           
           for(let s = 0; s < seatCount; s++) {
              let physicalSeat;
              if (sec.id === 'L') {
                 // Odds on the left: Lowest number (1) is on the far OUTSIDE edge (s = 0)
                 physicalSeat = (s * 2) + 1; 
              } else {
                 // Evens on the right: Lowest number (2) is on the far OUTSIDE edge (highest s)
                 physicalSeat = ((seatCount - 1 - s) * 2) + 2; 
              }

              const seatId = `${displayRow}-${physicalSeat}`;
              const student = seatMap[seatId];
              
              let classes = 'seat';
              let tooltip = '';
              
              let studentId = '';
              let editValue = '';
              let innerText = '';
              
              if(student) {
                 classes += ` occupied`;
                 if(student.honor) classes += ' honor';
                 else if(student.military) classes += ' military';
                 else if(student.asb) classes += ' asb';
                 studentId = student.studentId;
                 
                 let displayName = `${student.firstName} ${student.lastName}`;
                 const validAcronyms = ['V', 'S', 'JH', 'A', 'W'];
                 
                 // 1. If this is a real student who has an acronym in their Notes column
                 if (student.Notes && validAcronyms.includes(String(student.Notes).trim().toUpperCase())) {
                     innerText = String(student.Notes).trim().toUpperCase();
                 }

                 // 2. If this is a placeholder Staff/Acronym seat
                 if (String(student.studentId).startsWith('STAFF-')) {
                   displayName = student.lastName; 
                   
                   // Check if the name itself is just the acronym (e.g. "JH")
                   if (validAcronyms.includes(displayName.toUpperCase())) {
                       innerText = displayName.toUpperCase();
                   } else if (!innerText) { 
                       // Only calculate initials if the Notes column didn't already provide an acronym
                       const nameParts = student.lastName.split(' ').filter(n => n);
                       if (nameParts.length > 1) {
                         innerText = (nameParts[0][0] + nameParts[nameParts.length-1][0]).toUpperCase();
                       } else if (nameParts.length === 1) {
                         innerText = nameParts[0].substring(0, 2).toUpperCase();
                       }
                   }
                 }
                 
                 tooltip = `onmouseenter="Seating.showTooltip(event, '${displayName.replace(/'/g, "\\'")}', '${student.studentId}', '${displayRow}', '${physicalSeat}')" onmouseleave="Seating.hideTooltip()"`;
              } else {
                 classes += ` empty`;
                 tooltip = `onmouseenter="Seating.showTooltip(event, 'Empty Seat', '', '${displayRow}', '${physicalSeat}')" onmouseleave="Seating.hideTooltip()"`;
              }
              
              // Apply clean CSS classes for different roles
              if (student) {
                  studentId = student.studentId;
                  
                  // 1. Safely read the Notes column directly from the database
                  const note = student.Notes ? String(student.Notes).trim() : '';
                  const noteUpper = note.toUpperCase();
                  
                  // 2. Determine if this is a real staff member vs an empty placeholder
                  const isStaff = String(student.studentId).startsWith('STAFF-');
                  const validAcronyms = ['V', 'S', 'JH', 'A', 'W'];
                  const lastNameRaw = student.lastName ? student.lastName.trim() : '';
                  const lastNameUpper = lastNameRaw.toUpperCase();
                  
                  // BUILD THE EDIT VALUE FOR THE MODAL
                  if (isStaff) {
                      editValue = lastNameRaw;
                      if (note && lastNameUpper !== noteUpper) editValue += ' ' + note;
                  } else {
                      editValue = student.studentId;
                      if (note) editValue += ' ' + note;
                  }

                  // A placeholder is a STAFF record whose ENTIRE last name is just an acronym
                  const isPlaceholder = isStaff && validAcronyms.includes(lastNameUpper);
                  
                  // 3. Define strict rules for the special roles based on Notes or Placeholders
                  const isJH = noteUpper === 'JH' || (isPlaceholder && lastNameUpper === 'JH');
                  const isAide = noteUpper === 'A' || (isPlaceholder && lastNameUpper === 'A');
                  const isValSal = noteUpper === 'V' || noteUpper === 'S' || (isPlaceholder && (lastNameUpper === 'V' || lastNameUpper === 'S'));

                  // 4. Apply colors, strictly prioritizing special roles OVER the generic staff color
                  if (isJH) {
                      classes += ' jh';
                  } else if (isAide) {
                      classes += ' aide';
                  } else if (isValSal) {
                      classes += ' val-sal';
                  } else if (isStaff && !isPlaceholder) {
                      // Standard staff members (like Jessica Hall) safely fall through to here
                      classes += ' staff-blue';
                  } else if (student.honor) {
                      classes += ' honor-orange';
                  } else if (!student.military && !student.asb) {
                      classes += ' regular';
                  }
              }
              
              // Draw the seat box
              seatsHtml += `<div class="${classes}" ${tooltip} onclick="Seating.openSeatModal('${displayRow}', '${physicalSeat}', '${studentId}', '${editValue.replace(/'/g, "\\'")}')">
                              <span style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 8.5px; font-weight: bold; pointer-events: none;">${innerText}</span>
                            </div>`;
           }
           
           if (sec.id === 'L') {
             // Left section: Label goes on the RIGHT side of the seats
             rowsHtml += `
               <div class="seat-row">
                  <div class="seats-in-row">${seatsHtml}</div>
                  <div class="row-label" style="text-align: left; margin-left: 4px; display: flex; align-items: center; gap: 6px; width: auto; color: var(--text-primary); font-weight: 600;">
                     ${displayRow}
                     <input type="number" min="0" max="100" value="${seatCount}" onchange="Seating.updateRowSeats('${sec.id}', ${rowIndex}, this.value)" style="width: 44px; padding: 2px 4px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px; text-align: center;" title="Change number of seats in this row">
                  </div>
               </div>
             `;
           } else {
             // Right section: Label goes on the LEFT side of the seats
             rowsHtml += `
               <div class="seat-row">
                  <div class="row-label" style="margin-right: 4px; display: flex; align-items: center; gap: 6px; width: auto; color: var(--text-primary); font-weight: 600;">
                     <input type="number" min="0" max="100" value="${seatCount}" onchange="Seating.updateRowSeats('${sec.id}', ${rowIndex}, this.value)" style="width: 44px; padding: 2px 4px; font-size: 12px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary); border-radius: 4px; text-align: center;" title="Change number of seats in this row">
                     ${displayRow}
                  </div>
                  <div class="seats-in-row">${seatsHtml}</div>
               </div>
             `;
           }
        });
        
        return `
          <div class="section-block">
             <div class="section-label" style="justify-content: ${sec.id === 'L' ? 'flex-end' : 'flex-start'};">
                ${sec.label} <span class="section-count">${totalSeats} seats</span>
             </div>
             <div class="seat-rows" style="align-items: ${sec.id === 'L' ? 'flex-end' : 'flex-start'};">
                ${rowsHtml}
             </div>
          </div>
        `;
     }).join('');

     canvas.innerHTML = `
        <div class="seating-page" style="align-items: center;">
           <div class="stage-banner" style="width: 100%; max-width: 600px;">Stage / Podium</div>
           <div class="sections-container" style="justify-content: center; width: 100%;">${sectionsHtml}</div>
        </div>
     `;
  }

  function openConfigModal() {
    if(!currentConfig) return;
    let html = `<div id="seating-config-wrap"><p class="text-muted mb-16" style="font-size:13px; line-height:1.5">Define seats per row, separated by commas.</p>`;
    currentConfig.sections.forEach((sec, idx) => {
       html += `
         <div class="form-group mb-16">
           <label class="form-label">${sec.label} - Seats per Row</label>
           <textarea class="form-textarea mono" id="cfg-sec-${idx}" rows="2">${sec.rows.join(', ')}</textarea>
         </div>`;
    });
    html += `
        <div class="form-group mb-16">
           <label class="toggle-chip ${currentConfig.honorFront ? 'checked' : ''}" style="--chip-color: var(--cat-honor); width:fit-content;">
             <input type="checkbox" id="cfg-honor" ${currentConfig.honorFront ? 'checked' : ''} onchange="this.parentElement.classList.toggle('checked', this.checked)">
             <span class="ti ti-star"></span> Seat Honor Grads in Front
           </label>
        </div>
        <div class="modal-footer" style="margin-top:0">
          <button type="button" class="btn btn-ghost" onclick="UI.closeModal()">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="Seating.saveConfig()">Save Configuration</button>
        </div>
      </div>`;
    UI.openModal('Seating Layout Config', html);
  }

  async function saveConfig() {
    let newConfig = JSON.parse(JSON.stringify(currentConfig)); 
    newConfig.sections.forEach((sec, idx) => {
       sec.rows = document.getElementById(`cfg-sec-${idx}`).value.split(',').map(n => parseInt(n.trim(), 10)).filter(n => !isNaN(n) && n > 0);
    });
    newConfig.honorFront = document.getElementById('cfg-honor').checked;
    
    try {
      const res = await App.Server.saveSeatingConfig(newConfig);
      if(res.success) {
         currentConfig = newConfig;
         UI.closeModal();
         UI.navigate('seating'); 
      }
    } catch(err) { UI.toast(err.message, 'error'); }
  }

  function updateRowSeats(sectionId, rowIndex, newCount) {
     const count = parseInt(newCount, 10);
     if (isNaN(count) || count < 0) return;
     
     const sec = currentConfig.sections.find(s => s.id === sectionId);
     if (sec && sec.rows[rowIndex] !== count) {
        sec.rows[rowIndex] = count;
        
        // Re-render the visual chart instantly so it feels snappy
        _renderChart(currentConfig, currentSeatMap);
        
        // Save silently in the background
        App.Server.saveSeatingConfig(currentConfig)
          .then(res => { if(!res.success) throw new Error(res.error); })
          .catch(err => UI.toast('Failed to save layout: ' + err.message, 'error'));
     }
  }

  function openSeatModal(rowLabel, seatNumber, currentId, editValue = '') {
    const isOccupied = !!currentId;
    const title = isOccupied ? `Manage Seat ${rowLabel}-${seatNumber}` : `Assign Seat ${rowLabel}-${seatNumber}`;
    
    let html = `
      <div style="padding: 10px 0;">
        <p class="text-secondary mb-16" style="font-size: 13px;">
          Enter a Student ID to assign this seat, or type a Staff Name to reserve it for staff.
        </p>
        <div class="form-group mb-16">
          <label class="form-label">Student ID or Staff Name</label>
          <input type="text" id="seat-assign-input" class="form-input" 
                 value="${editValue || currentId || ''}" 
                 placeholder="e.g. 123456 or Mr. Smith" autocomplete="off">
        </div>
      </div>
      <div class="modal-footer" style="margin-top: 0;">
        ${isOccupied ? `<button type="button" class="btn btn-danger" style="margin-right: auto;" onclick="Seating.clearSeat('${rowLabel}', '${seatNumber}', '${currentId}')">Clear Seat</button>` : ''}
        <button type="button" class="btn btn-ghost" onclick="UI.closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" id="save-seat-btn" onclick="Seating.saveSeatAssignment('${rowLabel}', '${seatNumber}', '${currentId}')">Save Assignment</button>
      </div>
    `;
    UI.openModal(title, html);
  }

  async function saveSeatAssignment(rowLabel, seatNumber, previousId) {
    const inputVal = document.getElementById('seat-assign-input').value.trim();
    if (!inputVal) {
       if (previousId) return clearSeat(rowLabel, seatNumber, previousId);
       return UI.closeModal();
    }

    const btn = document.getElementById('save-seat-btn');
    btn.disabled = true; btn.innerText = 'Saving...';

    try {
      const res = await App.Server.assignSeatManually(rowLabel, seatNumber, inputVal, previousId);
      if (res.success) {
         UI.closeModal();
         UI.toast('Seat assigned!', 'success');
         await App.refreshData(); // Pulls the new data
         Seating.render(document.getElementById('view-container')); // Redraws the map
      } else {
         throw new Error(res.error);
      }
    } catch(err) {
      UI.toast(err.message, 'error');
      btn.disabled = false; btn.innerText = 'Save Assignment';
    }
  }

  async function clearSeat(rowLabel, seatNumber, studentId) {
    try {
      const res = await App.Server.assignSeatManually(rowLabel, seatNumber, '', studentId);
      if (res.success) {
         UI.closeModal();
         UI.toast('Seat cleared.', 'success');
         await App.refreshData();
         Seating.render(document.getElementById('view-container'));
      } else {
         throw new Error(res.error);
      }
    } catch(err) {
      UI.toast(err.message, 'error');
    }
  }

  function showTooltip(e, name, id, row, seatNum) {
     let tt = document.getElementById('seating-tt') || document.createElement('div');
     tt.id = 'seating-tt'; tt.className = 'seat-tooltip';
     if(!document.getElementById('seating-tt')) document.body.appendChild(tt);
     tt.innerHTML = `<div class="tip-name">${name}</div><div class="tip-id">${id ? id : `Row ${row}, Seat ${seatNum}`}</div>`;
     const rect = e.target.getBoundingClientRect();
     tt.style.left = (rect.left + rect.width / 2 - tt.offsetWidth / 2) + 'px';
     tt.style.top = (rect.top - tt.offsetHeight - 8) + 'px';
  }

  function hideTooltip() {
     const tt = document.getElementById('seating-tt');
     if(tt) tt.remove();
  }

  function generate(overwriteAll = false) {
     let msg = overwriteAll ? 'This will OVERWRITE ALL manual seat assignments. Proceed?' : 'This will auto-assign seats, keeping manual assignments locked. Proceed?';
     UI.confirm(msg, async () => {
        try {
           const res = await App.Server.generateSeating(overwriteAll);
           if(res.success) {
              UI.toast(`Successfully assigned seats.`, 'success');
              // Ensure local state is cleared so the frontend table reflects reality
              await App.refreshData();
              UI.navigate('seating'); 
           } else { throw new Error(res.error); }
        } catch(err) { UI.toast(err.message, 'error'); }
     });
  }

  async function assignJHToRowK() {
    const btn = document.getElementById('btn-assign-jh');
    btn.disabled = true;
    btn.innerHTML = '<span class="ti ti-loader spin"></span> Assigning...';

    try {
      const res = await App.Server.assignJHRowK();
      if (res.success) {
        UI.toast(`Successfully assigned ${res.count} Junior Honors to Row K!`, 'success');
        if (res.count < res.totalJH) {
            UI.toast(`Warning: ${res.totalJH - res.count} JH students didn't fit in Row K. Add more seats to Row K!`, 'warning');
        }
        await App.refreshData(); // Pulls the new data from the database
        render(document.getElementById('view-container')); // Redraws the map
      } else {
        throw new Error(res.error);
      }
    } catch(err) {
      UI.toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="ti ti-users"></span> Assign JH to Row K';
    }
  }

  return { 
    render, generate, showTooltip, hideTooltip, openConfigModal, saveConfig, 
    openSeatModal, saveSeatAssignment, clearSeat, updateRowSeats, assignJHToRowK // <--- Add these three here
  };
})();
</script>
