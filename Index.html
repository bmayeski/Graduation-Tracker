<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body>

  <!-- ── App Shell ─────────────────────────────────── -->
  <div id="app" class="app-shell">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="url(#brandGrad)"/>
          <path d="M8 22 L16 10 L24 22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M11 18 h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <circle cx="16" cy="8" r="2.5" fill="white"/>
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0%" stop-color="#3B6FE8"/>
              <stop offset="100%" stop-color="#6C47FF"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="brand-text">
          <span class="brand-title">Graduation Tracker</span>
          <span class="brand-sub">Class of 2027</span>
        </div>
        <button class="sidebar-toggle" onclick="UI.toggleSidebar()" aria-label="Collapse sidebar">
          <span class="ti ti-layout-sidebar-left-collapse"></span>
        </button>
      </div>

      <ul id="main-nav" class="sidebar-nav"></ul>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">–</div>
          <div class="user-info">
            <span class="user-name" id="user-name">Loading…</span>
            <span class="user-role" id="user-role">–</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main" class="main-content">
      <div id="view-container">
        <!-- Views injected by JS -->
        <div class="loading-screen">
          <div class="spinner"></div>
          <p>Loading Graduation Tracker…</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ── Modal Overlay ─────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="UI.closeModal(event)">
    <div class="modal-box" id="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button class="modal-close" onclick="UI.closeModal()">
          <span class="ti ti-x"></span>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ── Toast Notifications ───────────────────────── -->
  <div id="toast-container" class="toast-container"></div>

</html>
