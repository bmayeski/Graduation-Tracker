<script>
const UI = (() => {
  function bootstrap() {
    const user = App.getUser();
    if (!user) return;
    
    const fName = user.firstName || '';
    const lName = user.lastName || '';
    const initials = (fName.charAt(0) + lName.charAt(0)).toUpperCase() || user.email.charAt(0).toUpperCase();
    
    document.getElementById('user-name').innerText = (fName + ' ' + lName).trim() || user.email;
    document.getElementById('user-avatar').innerText = initials;
    
    buildSidebar();
    navigate('dashboard');
  }

  function buildSidebar() {
    const stats = App.getStats();
    const nav = document.getElementById('main-nav'); 
    if (!nav) return;

    let html = `
      <div class="nav-section-label">Overview</div>
      
      <li class="nav-item" data-view="dashboard" onclick="UI.navigate('dashboard')">
        <span class="ti ti-layout-dashboard"></span> <span class="nav-label">Dashboard</span>
      </li>
      
      <li class="nav-item" data-view="students" onclick="Students.renderStudentList(document.getElementById('view-container'), 'all')">
        <span class="ti ti-users"></span> <span class="nav-label">All Students</span> 
        <span class="nav-badge">${stats.total || 0}</span>
      </li>

      <li class="nav-item" data-view="walking" onclick="Students.renderStudentList(document.getElementById('view-container'), 'walking')">
        <span class="ti ti-walking"></span> <span class="nav-label">Walking</span> 
        <span class="nav-badge">${stats.walking || 0}</span>
      </li>
      
      <li class="nav-item" data-view="not_participating" onclick="UI.navigate('notwalking')">
        <span class="ti ti-user-x"></span> <span class="nav-label">Not Participating</span> 
        <span class="nav-badge">${stats.notParticipating || 0}</span>
      </li>
      
      <div class="nav-section-label" style="margin-top: 16px;">Cords & Programs</div>
      <li class="nav-item" data-view="cords" onclick="UI.navigate('cords')">
        <span class="ti ti-medal"></span> <span class="nav-label">Cords & Programs</span>
      </li>

      <div class="nav-section-label" style="margin-top: 16px;">Administration</div>
      <li class="nav-item" data-view="administrative" onclick="UI.navigate('administrative')">
        <span class="ti ti-briefcase"></span> <span class="nav-label">Administrative</span>
      </li>
    `;

    if(App.isAdmin()) {
      html += `
        <div class="nav-section-label" style="margin-top: 16px;">Administration</div>
        
        <li class="nav-item" data-view="seating" onclick="UI.navigate('seating')">
          <span class="ti ti-armchair"></span> <span class="nav-label">Seating Chart</span>
        </li>
        
        <li class="nav-item" data-view="users" onclick="UI.navigate('users')">
          <span class="ti ti-user-shield"></span> <span class="nav-label">User Management</span>
        </li>
        
        <li class="nav-item" data-view="adminpanel" onclick="UI.navigate('adminpanel')">
          <span class="ti ti-settings"></span> <span class="nav-label">Settings</span>
        </li>
      `;
    }
    
    nav.innerHTML = html;
  }

  function navigate(viewId) {
    App.setState({ currentView: viewId });
    const container = document.getElementById('view-container');
    
    if (!container) return;

    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const activeNav = document.querySelector(`.nav-item[data-view="${viewId}"]`);
    if(activeNav) activeNav.classList.add('active');

    container.innerHTML = '';

    if (viewId.startsWith('cat_')) {
      const catId = viewId.split('_')[1];
      const category = App.getCategories().find(c => c.id === catId);
      const group = category ? category.group : null; 
      categoriesView(container, catId, group);
      return;
    }

    switch(viewId) {
      case 'dashboard': renderDashboard(container); break;
      case 'students': Students.renderStudentList(container); break;
      case 'adminpanel': renderAdminPanel(container); break;
      case 'seating': Seating.render(container); break;
      case 'users': UsersAdmin.render(container); break;
      case 'walking': Students.renderStudentList(container, 'walking'); break;
      case 'not_participating':
      case 'notwalking':
      case 'nongrad':
        // Generate mock categories so the tab system natively supports them
        const mockCats = [
          { id: 'notwalking', label: 'Not Walking', color: '#FF5566', icon: 'user-x' },
          { id: 'nongrad', label: 'Non-Grad', color: '#FF5566', icon: 'school-off' }
        ];
        // Determine which tab to default to based on what was clicked
        let startTab = 'notwalking';
        if (viewId === 'nongrad') startTab = 'nongrad';
        
        categoriesView(container, startTab, null, mockCats);
        break;
      case 'cords':
        categoriesView(container, null, 'Cord'); break;
      case 'administrative':
        categoriesView(container, null, 'Admin'); break;
      default: renderDashboard(container);
    }
  }

  function renderDashboard(container) {
    const stats = App.getStats();
    const cats = App.getCategories();

    const generateCards = (group) => cats.filter(c => c.group === group).map(c => `
      <div class="stat-card clickable" onclick="UI.navigate('cat_${c.id}')" style="--accent: ${c.color}">
        <div class="stat-value">${stats[c.id] || 0}</div>
        <div class="stat-label"><span class="ti ti-${c.icon}"></span> ${c.label}</div>
      </div>`).join('');

    container.innerHTML = `
      <h1>Dashboard</h1>
      <div class="stat-grid mb-24">
        <div class="stat-card clickable" onclick="Students.showFiltered('total')">
          <div class="stat-value">${stats.total}</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-card clickable" onclick="Students.showFiltered('walking')" style="--accent: var(--accent-green)">
          <div class="stat-value">${stats.walking}</div>
          <div class="stat-label">Walking</div>
        </div>
        <div class="stat-card clickable" onclick="UI.navigate('notwalking')" style="--accent: var(--accent-red)">
          <div class="stat-value">${stats.notWalking}</div>
          <div class="stat-label">Not Walking</div>
        </div>
        <div class="stat-card clickable" onclick="UI.navigate('nongrad')" style="--accent: var(--accent-red)">
          <div class="stat-value">${stats.nonGrad}</div>
          <div class="stat-label">Non-Grad</div>
        </div>
      </div>
      
      <h3 class="section-divider">Cords & Programs</h3>
      <div class="stat-grid mb-24">${generateCards('Cord')}</div>
      
      <h3 class="section-divider">Administrative</h3>
      <div class="stat-grid">${generateCards('Admin')}</div>
    `;
  }

  function renderAdminPanel(container) {
    const cats = App.getCategories();
    let rows = cats.map(c => `
      <tr>
        <td><strong>${c.label}</strong> <span class="badge" style="font-size:10px">${c.group}</span></td>
        <td>
          <input type="checkbox" ${c.showInSidebar ? 'checked' : ''} 
                 onchange="UI.toggleNav('${c.id}', this.checked)"
                 style="transform: scale(1.5); cursor:pointer;">
        </td>
      </tr>
    `).join('');

    container.innerHTML = `
      <div class="page-header"><h1>App Settings</h1></div>
      <div class="card">
        <h3>Sidebar Navigation Toggles</h3>
        <p style="color:var(--text-muted); margin-bottom:16px;">Check the box to force a list to appear permanently in the left-hand navigation menu.</p>
        <table class="data-table">
          <thead><tr><th>Category List</th><th>Show in Sidebar</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function categoriesView(container, forceTabId = null, filterGroup = null, customCats = null) {
    let cats = customCats || App.getCategories();
    if (filterGroup && !customCats) {
      cats = cats.filter(c => c.group === filterGroup);
    }
    
    let tabsHtml = cats.map((c) => {
      const rgb = hexToRgba(c.color);
      return `<button class="tab-btn" data-cat="${c.id}" 
                onclick="UI.switchCategoryTab('${c.id}')"
                style="--cat-bg: ${rgb.bg}; --cat-border: ${rgb.border};">
                <span class="ti ti-${c.icon}" style="color: ${c.color}"></span> ${c.label}
              </button>`;
    }).join('');

    // Dynamically change the title if it's the Not Participating view
    const pageTitle = customCats ? "Not Participating" : "Manage Lists";

    container.innerHTML = `
      <div class="page-header">
        <div class="page-title-block">
          <h1>${pageTitle}</h1>
        </div>
        <div class="header-actions" id="cat-actions-container"></div>
      </div>
      <div class="tab-bar">${tabsHtml}</div>
      <div class="card" style="margin-top: 16px;">
        <div class="table-responsive">
          <table class="data-table" id="cat-table">
             <thead><tr><th>Student</th><th>ID</th><th>Status</th><th>Actions</th></tr></thead>
             <tbody></tbody>
          </table>
        </div>
      </div>
    `;
    
    const activeTab = forceTabId || (cats.length > 0 ? cats[0].id : null);
    if(activeTab) switchCategoryTab(activeTab);
  }

  function switchCategoryTab(categoryId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    const btn = document.querySelector(`.tab-btn[data-cat="${categoryId}"]`);
    if(btn) btn.classList.add('active');

    const actionContainer = document.getElementById('cat-actions-container');
    if (actionContainer) {
      actionContainer.innerHTML = `
        <button class="btn btn-secondary" onclick="Students.openBulkAddModal('${categoryId}')">
          <span class="ti ti-upload"></span> Bulk Import IDs
        </button>
        <button class="btn btn-primary" onclick="Students.openAddModal('${categoryId}')">
          <span class="ti ti-plus"></span> Add Single
        </button>
      `;
    }

    let category = App.getCategories().find(c => c.id === categoryId);
    let catLabel = categoryId;

    // Safety fallback so the mock "Not Participating" tabs don't crash
    if (!category) {
      if (categoryId === 'notwalking') category = { id: 'notwalking', label: 'Not Walking' };
      else if (categoryId === 'nongrad') category = { id: 'nongrad', label: 'Non-Grad' };
      else category = { id: categoryId, label: categoryId };
      catLabel = category.label;
    }

    const students = App.getStudents().filter(s => s[categoryId] === true || s[catLabel] === true);
    const tbody = document.querySelector('#cat-table tbody');
    
    if (students.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 32px; color: var(--text-muted);">No students flagged for this yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = students.map(s => `
      <tr>
        <td><strong>${s.lastName}, ${s.firstName}</strong></td>
        <td>${s.studentId}</td>
        <td>${(s['notwalking'] || s['nongrad']) ? '<span class="badge warning">Not Walking</span>' : '<span class="badge success">Walking</span>'}</td>
        <td>
          <div class="row-actions">
            <button class="btn btn-secondary btn-sm" onclick="Students.openEditModal('${s.studentId}')">
              Edit
            </button>
            <button class="btn btn-danger btn-sm" onclick="Students.removeFromList('${s.studentId}', '${categoryId}')">
              Remove
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function hexToRgba(hex) {
    let c;
    if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
      c= hex.substring(1).split('');
      if(c.length== 3){ c= [c[0], c[0], c[1], c[1], c[2], c[2]]; }
      c= '0x'+c.join('');
      return {
        bg: 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+',0.15)',
        border: 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+',0.3)'
      };
    }
    return { bg: 'rgba(0,0,0,0.1)', border: 'rgba(0,0,0,0.2)' };
  }

  function toggleNav(id, show) {
    App.Server.toggleCategoryNav(id, show).then(() => App.refreshData().then(() => buildSidebar()));
  }

  // Ensure these match exactly what your buttons call
  function openModal(title, html, options = {}) {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-overlay').classList.remove('hidden');
  }

  function closeModal(event) {
    // If an event is passed, only close if the target IS the overlay
    if (event && event.target.id !== 'modal-overlay') {
      return;
    }
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  function toast(msg, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerText = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function confirm(msg, callback) {
    const html = `
      <p style="margin-bottom: 20px;">${msg}</p>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn btn-secondary" onclick="UI.closeModal()">Cancel</button>
        <button class="btn btn-danger" onclick="UI.closeModal(); (${callback.toString()})()">Confirm</button>
      </div>
    `;
    openModal('Are you sure?', html);
  }

  return { 
    bootstrap, navigate, buildSidebar, toggleNav, categoriesView, 
    switchCategoryTab, hexToRgba,
    openModal, closeModal, toast, confirm // closeModal is now exposed
  };
})();
</script>
