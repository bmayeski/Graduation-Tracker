<script>
/* ============================================================
   APP.JS  —  Bootstrap, global state, server bridge
   ============================================================ */

'use strict';

const App = (() => {
  let _state = {
    user:       null,
    students:   [],
    categories: [],
    seating:    null,
    stats:      {},
    loading:    true,
    currentView: 'dashboard'
  };

  // ── Getters & Mutations ────────────────────────────────────
  function getState()     { return _state; }
  function getUser()      { return _state.user; }
  function getStudents()  { return _state.students; }
  function getStats()     { return _state.stats; }
  function getSeating()   { return _state.seating; }
  function getCategories(){ return _state.categories; }
  function isAdmin()      { return _state.user && _state.user.role === 'admin'; }

  function setState(patch) { Object.assign(_state, patch); }

  function upsertStudent(student) {
    const idx = _state.students.findIndex(s => s.studentId === student.studentId);
    if (idx >= 0) { _state.students[idx] = student; } else { _state.students.push(student); }
    _recalcStats();
  }

  function removeStudent(studentId) {
    _state.students = _state.students.filter(s => s.studentId !== studentId);
    _recalcStats();
  }

  function _recalcStats() {
    const s = _state.students;
    _state.stats.total = s.length;
    _state.stats.walking = s.filter(x => x['Not Walking'] !== true && x['Non-Grad'] !== true).length;
    _state.stats.notWalking = s.filter(x => x['Not Walking'] === true).length;
    _state.stats.nonGrad = s.filter(x => x['Non-Grad'] === true).length;
  }

  // ── Initialization & Data Loading ──────────────────────────
  function init() {
    google.script.run
      .withSuccessHandler(_onDataLoaded)
      .withFailureHandler(_onLoadError)
      .getInitialData();
  }

  async function refreshData() {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(response => {
          try {
            const data = JSON.parse(response);
            setState({ ...data, loading: false });
            resolve();
          } catch(e) {
            console.error("Parse Error on Refresh:", e);
            reject(e);
          }
        })
        .withFailureHandler(reject)
        .getInitialData();
    });
  }

  function _onDataLoaded(response) {
    if (!response) {
       console.error("Received empty response from server.");
       return;
    }
    try {
      const data = JSON.parse(response);
      setState({ ...data, loading: false });
      UI.bootstrap();
    } catch (e) {
      console.error("Parse Error:", e);
    }
  }

  // THIS IS THE MISSING FUNCTION
  function _onLoadError(err) {
    console.error("App Init Failed:", err);
    const container = document.getElementById('view-container');
    if(container) {
      container.innerHTML = `
        <div class="card" style="margin-top: 20px;">
          <h3 style="color: var(--accent-red);">Failed to load data</h3>
          <p>${err ? err.toString() : 'Unknown error occurred while contacting the server.'}</p>
        </div>`;
    }
  }

  // ── Server Bridge ─────────────────────────────────────────
  function runServer(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .serverDispatcher(fnName, args);
    });
  }

  const Server = {
    addStudent:         (p) => runServer('StudentService.addStudent', p),
    updateStudent:      (id, p) => runServer('StudentService.updateStudent', id, p),
    deleteStudent:      (id) => runServer('StudentService.deleteStudent', id),
    bulkAssignCategory: (ids, cat) => runServer('StudentService.bulkAssignCategory', ids, cat),
    getSeatingChart:    () => runServer('SeatingService.getSeatingChart'),
    generateSeating:    (overwriteAll) => runServer('SeatingService.generateSeatingAssignments', overwriteAll),
    saveSeatingConfig:  (config) => runServer('SeatingService.saveSeatingConfig', config),
    toggleCategoryNav:  (id, show) => runServer('CategoryService.toggleSidebar', id, show),
    addCategory:        (p) => runServer('CategoryService.addCategory', p),
    deleteCategory:     (id) => runServer('CategoryService.deleteCategory', id),
    assignSeatManually: (row, seat, val, prevId) => runServer('SeatingService.assignSeatManually', row, seat, val, prevId),
    assignJHRowK:       () => runServer('SeatingService.assignJuniorHonorsToRowK'),
  };

  // ── Return Public API ──────────────────────────────────────
  return {
    getState, getUser, getStudents, getStats, getSeating,
    getCategories, isAdmin, 
    setState, upsertStudent, removeStudent,
    init, Server, refreshData
  };
})();

// ── Boot ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => App.init());
</script>
